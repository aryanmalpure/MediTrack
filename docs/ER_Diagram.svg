<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #0d3b66; stroke-width: 2; rx: 6; }
      .header { fill: #0d3b66; }
      .header-text { fill: #ffffff; font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; }
      .row-text { fill: #333333; font-family: Arial, sans-serif; font-size: 12px; }
      .pk { fill: #b02a37; font-weight: bold; }
      .fk { fill: #0056b3; font-style: italic; }
      .rel-line { stroke: #1a4975; stroke-width: 2; fill: none; }
      .rel-text { fill: #0d3b66; font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="800" fill="#f8f9fa"/>
  
  <text x="550" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0d3b66">MediTrack – Entity Relationship Diagram (EER)</text>
  <text x="550" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#666666">Relational Database Model with BCNF Compliant 1:N Associations</text>

  <!-- PATIENTS ENTITY -->
  <g transform="translate(50, 100)">
    <rect class="box" width="240" height="230"/>
    <rect class="header" width="240" height="32" rx="6"/>
    <rect class="header" y="20" width="240" height="12"/>
    <text x="120" y="22" text-anchor="middle" class="header-text">PATIENTS</text>
    <text x="15" y="52" class="row-text pk">PK patient_id (INT)</text>
    <text x="15" y="72" class="row-text">name (VARCHAR 100)</text>
    <text x="15" y="92" class="row-text">date_of_birth (DATE)</text>
    <text x="15" y="112" class="row-text">gender (VARCHAR 10)</text>
    <text x="15" y="132" class="row-text">phone (VARCHAR 20)</text>
    <text x="15" y="152" class="row-text">email (VARCHAR 100, UNIQUE)</text>
    <text x="15" y="172" class="row-text">address (VARCHAR 255)</text>
    <text x="15" y="192" class="row-text">blood_group (VARCHAR 10)</text>
    <text x="15" y="212" class="row-text">created_at (TIMESTAMP)</text>
  </g>

  <!-- CLINICIANS ENTITY -->
  <g transform="translate(810, 100)">
    <rect class="box" width="240" height="150"/>
    <rect class="header" width="240" height="32" rx="6"/>
    <rect class="header" y="20" width="240" height="12"/>
    <text x="120" y="22" text-anchor="middle" class="header-text">CLINICIANS</text>
    <text x="15" y="52" class="row-text pk">PK clinician_id (INT)</text>
    <text x="15" y="72" class="row-text">name (VARCHAR 100)</text>
    <text x="15" y="92" class="row-text">specialization (VARCHAR 100)</text>
    <text x="15" y="112" class="row-text">phone (VARCHAR 20)</text>
    <text x="15" y="132" class="row-text">email (VARCHAR 100, UNIQUE)</text>
  </g>

  <!-- ENCOUNTERS ENTITY -->
  <g transform="translate(430, 100)">
    <rect class="box" width="240" height="190"/>
    <rect class="header" width="240" height="32" rx="6"/>
    <rect class="header" y="20" width="240" height="12"/>
    <text x="120" y="22" text-anchor="middle" class="header-text">ENCOUNTERS</text>
    <text x="15" y="52" class="row-text pk">PK encounter_id (INT)</text>
    <text x="15" y="72" class="row-text fk">FK patient_id (INT)</text>
    <text x="15" y="92" class="row-text fk">FK clinician_id (INT)</text>
    <text x="15" y="112" class="row-text">encounter_date (DATETIME)</text>
    <text x="15" y="132" class="row-text">diagnosis (VARCHAR 255)</text>
    <text x="15" y="152" class="row-text">symptoms (TEXT)</text>
    <text x="15" y="172" class="row-text">treatment_notes (TEXT)</text>
  </g>

  <!-- ALLERGIES ENTITY -->
  <g transform="translate(50, 430)">
    <rect class="box" width="240" height="140"/>
    <rect class="header" width="240" height="32" rx="6"/>
    <rect class="header" y="20" width="240" height="12"/>
    <text x="120" y="22" text-anchor="middle" class="header-text">ALLERGIES</text>
    <text x="15" y="52" class="row-text pk">PK allergy_id (INT)</text>
    <text x="15" y="72" class="row-text fk">FK patient_id (INT)</text>
    <text x="15" y="92" class="row-text">allergen (VARCHAR 100)</text>
    <text x="15" y="112" class="row-text">reaction (VARCHAR 150)</text>
    <text x="15" y="132" class="row-text">severity (VARCHAR 20)</text>
  </g>

  <!-- MEDICAL_HISTORY ENTITY -->
  <g transform="translate(340, 430)">
    <rect class="box" width="240" height="160"/>
    <rect class="header" width="240" height="32" rx="6"/>
    <rect class="header" y="20" width="240" height="12"/>
    <text x="120" y="22" text-anchor="middle" class="header-text">MEDICAL_HISTORY</text>
    <text x="15" y="52" class="row-text pk">PK history_id (INT)</text>
    <text x="15" y="72" class="row-text fk">FK patient_id (INT)</text>
    <text x="15" y="92" class="row-text">condition_name (VARCHAR 150)</text>
    <text x="15" y="112" class="row-text">diagnosis_date (DATE)</text>
    <text x="15" y="132" class="row-text">status (VARCHAR 50)</text>
    <text x="15" y="152" class="row-text">notes (TEXT)</text>
  </g>

  <!-- MEDICATIONS ENTITY -->
  <g transform="translate(630, 430)">
    <rect class="box" width="240" height="180"/>
    <rect class="header" width="240" height="32" rx="6"/>
    <rect class="header" y="20" width="240" height="12"/>
    <text x="120" y="22" text-anchor="middle" class="header-text">MEDICATIONS</text>
    <text x="15" y="52" class="row-text pk">PK medication_id (INT)</text>
    <text x="15" y="72" class="row-text fk">FK patient_id (INT)</text>
    <text x="15" y="92" class="row-text">medication_name (VARCHAR 100)</text>
    <text x="15" y="112" class="row-text">dosage (VARCHAR 50)</text>
    <text x="15" y="132" class="row-text">start_date (DATE)</text>
    <text x="15" y="152" class="row-text">end_date (DATE)</text>
    <text x="15" y="172" class="row-text">instructions (TEXT)</text>
  </g>

  <!-- ENCOUNTER_AUDIT ENTITY -->
  <g transform="translate(430, 640)">
    <rect class="box" width="240" height="130"/>
    <rect class="header" width="240" height="28" rx="6"/>
    <rect class="header" y="18" width="240" height="10"/>
    <text x="120" y="20" text-anchor="middle" class="header-text" font-size="13">ENCOUNTER_AUDIT</text>
    <text x="15" y="46" class="row-text pk">PK audit_id (INT)</text>
    <text x="15" y="64" class="row-text">encounter_id, patient_id</text>
    <text x="15" y="82" class="row-text">action_type (INSERT/UPDATE/DELETE)</text>
    <text x="15" y="100" class="row-text">old/new diagnosis &amp; notes</text>
    <text x="15" y="118" class="row-text">changed_at, changed_by</text>
  </g>

  <!-- RELATIONSHIP LINES -->
  <!-- Patients to Encounters -->
  <line x1="290" y1="180" x2="430" y2="180" class="rel-line"/>
  <text x="360" y="172" text-anchor="middle" class="rel-text">1 : N</text>

  <!-- Clinicians to Encounters -->
  <line x1="810" y1="180" x2="670" y2="180" class="rel-line"/>
  <text x="740" y="172" text-anchor="middle" class="rel-text">1 : N</text>

  <!-- Patients to Allergies -->
  <line x1="170" y1="330" x2="170" y2="430" class="rel-line"/>
  <text x="185" y="380" class="rel-text">1 : N</text>

  <!-- Patients to Medical History -->
  <path d="M 230 330 L 230 370 L 410 370 L 410 430" class="rel-line"/>
  <text x="320" y="365" class="rel-text">1 : N</text>

  <!-- Patients to Medications -->
  <path d="M 270 330 L 270 390 L 720 390 L 720 430" class="rel-line"/>
  <text x="500" y="385" class="rel-text">1 : N</text>

  <!-- Encounters to Audit -->
  <line x1="550" y1="290" x2="550" y2="640" class="rel-line" stroke-dasharray="4,4"/>
  <text x="560" y="420" class="rel-text">Triggers Audit (1:N)</text>

</svg>
